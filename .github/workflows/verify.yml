name: Verify plugin
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:plugin
      - run: npm run verify:release
      - run: npm run probe:plugin
      - run: npm run pack:release
      - run: npm run test:clean-install
